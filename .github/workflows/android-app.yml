name: Android app release

on:
  workflow_dispatch:

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare Python tests and emulator host
        timeout-minutes: 8
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo chmod 666 /dev/kvm
          # All required packages belong to Ubuntu; unrelated runner repositories
          # must not hold up preparation. Keep network waits bounded and visible.
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o APT::Update::Error-Mode=any
          )
          sudo apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install \
            --no-install-recommends -y python3-yaml ripgrep libpulse0 libasound2t64 libxcb-cursor0
      - name: Create diagnostics directory
        run: mkdir -p build/ci-diagnostics
      - name: Run functional bug checks
        run: ./gradlew functionalCheck --no-daemon --stacktrace
      - name: Restore stable signing key
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SIGNING_KEYSTORE" || { echo 'Run scripts/configure-signing locally before a release build.' >&2; exit 1; }
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          umask 077
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'ANDROID_SIGNING_STORE_FILE=%s/release.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Build minified emulator smoke fixture
        run: ./gradlew :app:assembleSmoke --no-daemon --stacktrace
      - name: Run Compose and minified smoke tests on Android 14
        run: ./scripts/ci-device-tests 34
      - name: Run Compose and minified smoke tests on Android 16
        run: ./scripts/ci-device-tests 36
      - name: Verify, collect, and checksum exactly one APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          ./scripts/verify-apk "${apks[0]}" com.github.panlelapin.simplercal 34 36
          mkdir -p artifact
          cp -- "${apks[0]}" artifact/android-app-arm64-v8a.apk
          (cd artifact && sha256sum android-app-arm64-v8a.apk > android-app-arm64-v8a.apk.sha256)
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-app-arm64-v8a
          path: artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload test reports and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/release.jks"
