name: Android app release

on:
  workflow_dispatch:

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Run functional bug checks
        run: ./gradlew functionalCheck --no-daemon --stacktrace
      - name: Restore stable signing key
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SIGNING_KEYSTORE" || { echo 'Run scripts/configure-signing locally before a release build.' >&2; exit 1; }
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          umask 077
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'ANDROID_SIGNING_STORE_FILE=%s/release.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Run Compose device tests on Android 14
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo chmod 666 /dev/kvm
          sdkmanager "emulator" "system-images;android-34;google_apis;x86_64"
          echo no | avdmanager create avd -n tests -k "system-images;android-34;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd tests -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 180 adb wait-for-device
          booted=false
          for attempt in $(seq 1 180); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then booted=true; break; fi
            sleep 1
          done
          test "$booted" == true || { tail -n 100 "$RUNNER_TEMP/emulator.log"; exit 1; }
          adb shell input keyevent 82
          ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Verify, collect, and checksum exactly one APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          ./scripts/verify-apk "${apks[0]}" com.github.panlelapin.simplercal 34 36
          mkdir -p artifact
          cp -- "${apks[0]}" artifact/android-app-arm64-v8a.apk
          (cd artifact && sha256sum android-app-arm64-v8a.apk > android-app-arm64-v8a.apk.sha256)
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-app-arm64-v8a
          path: artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/release.jks"
